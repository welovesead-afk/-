<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEA.D 통합관리</title>
<style>
  :root { --main:#EEEEE6; --sub1:#D0BE9A; --sub2:#241916; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--main); color:var(--sub2);
         font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; padding:16px; }
  .card { max-width:420px; width:100%; background:#fff; border-top:6px solid var(--sub2);
          border-radius:12px; padding:28px 24px; box-shadow:0 2px 12px rgba(36,25,22,.08); }
  h1 { margin:0 0 4px; font-size:22px; letter-spacing:.04em; }
  .sub { color:#6b5d57; margin:0 0 20px; font-size:14px; }
  .badge { display:inline-block; background:var(--sub1); color:var(--sub2);
           border-radius:999px; padding:4px 12px; font-size:13px; font-weight:600; }
  small { display:block; margin-top:20px; color:#8a7d77; font-size:12px; }
</style>
</head>
<body>
  <main class="card">
    <h1>SEA.D 통합관리</h1>
    <p class="sub">기준정보 · 입고 · 생산일지 · 재고</p>
    <span class="badge">준비 중 — 배포 연결 테스트 페이지</span>
    <small id="ver">버전 확인 중…</small>
  </main>
<script>
  fetch('version.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(v => { document.getElementById('ver').textContent =
      '배포 ' + v.deployed_at.replace('T', ' ').slice(0, 16) + ' UTC · ' + v.commit.slice(0, 7); })
    .catch(() => { document.getElementById('ver').textContent = ''; });
</script>
</body>
</html>
