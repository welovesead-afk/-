<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#241916">
<title>SEA.D 통합관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo"><img src="img/logo-white.png" alt="SEA.D" height="28"><small>통합관리</small></div>
    <span class="demo-badge" title="브라우저에만 저장되는 예시 데이터입니다">시안 · 예시 데이터</span>
    <span class="spacer"></span>
    <div class="who" role="group" aria-label="사용자 전환(시안)">
      <button type="button" data-role="staff" aria-pressed="true">직원</button>
      <button type="button" data-role="owner" aria-pressed="false">대표</button>
    </div>
  </div>
  <nav class="tabs" aria-label="메뉴">
    <a href="#receive">입고 등록</a>
    <a href="#produce">생산일지</a>
    <a href="#sales">판매</a>
    <a href="#dashboard">대표 현황</a>
  </nav>
</header>

<main id="app" tabindex="-1"></main>

<nav class="bottom-nav" aria-label="메뉴">
  <a href="#receive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>입고</a>
  <a href="#produce"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V9l5 3V9l5 3V5h6v16z"/></svg>생산일지</a>
  <a href="#sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h13l5 5v5h-3M3 7v10h2M3 7l2-3h9l2 3"/><circle cx="7" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg>판매</a>
  <a href="#dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>현황</a>
</nav>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
